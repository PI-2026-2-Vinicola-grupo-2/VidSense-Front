<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertas · VidSense</title>
  <link rel="icon" href="imagens/logo-icone.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="side card" id="menu"></aside>

    <main>
      <header class="topo">
        <div>
          <h1>Alertas</h1>
          <p class="sub" id="resumo"></p>
        </div>
        <button class="pill" id="todas">Marcar todas como lidas</button>
      </header>

      <div class="seg" id="filtros">
        <button class="on" data-f="todos">Todos</button>
        <button data-f="warn">Atenção</button>
        <button data-f="info">Informativos</button>
        <button data-f="ok">Resolvidos</button>
      </div>

      <section class="card"><div class="lista" id="lista"></div></section>

      <h2 class="secao">Histórico</h2>
      <section class="card">
        <p class="rot" id="hist-nota"></p>
        <div class="scroll">
          <table>
            <thead><tr><th>Visto em</th><th>Tipo</th><th>Alerta</th><th>Situação</th></tr></thead>
            <tbody id="hist-linhas"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/alertas.js"></script>
</body>
</html>
